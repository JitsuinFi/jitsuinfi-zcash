[package]
name = "jitsuin-board"
version = "0.1.0"
description = "JitsuinFi registry board scanner: ordering, duplicate nullifier detection, invalid entry filtering"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
jitsuin-core = { path = "../jitsuin-core" }
jitsuin-wallet = { path = "../jitsuin-wallet" }
serde_json = "1.0.154"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "http2", "rustls"], optional = true }

[features]
# Network access (lightwalletd client and `scan`). Off for WASM clients, which get board data from an API.
default = ["net"]
net = ["dep:reqwest"]

[dev-dependencies]
ed25519-dalek.workspace = true
