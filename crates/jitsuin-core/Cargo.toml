[package]
name = "jitsuin-core"
version = "0.1.0"
description = "JitsuinFi core: canonical invoices, buyer signatures, shielded registry entries and signed receipts"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
blake2b_simd.workspace = true
# HNK-23.T2 (approved by the user 2026-10-20): mailbox keys (X25519) and sealed boxes
# (XSalsa20-Poly1305). Randomness comes from the caller, so no RNG crate is needed in wasm.
crypto_box = { version = "0.9.1", default-features = false, features = ["salsa20", "alloc"] }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets"] }
ed25519-dalek.workspace = true
sha2.workspace = true
