[package]
name = "jitsuin-flow"
version = "0.1.0"
description = "JitsuinFi role flows: financier check, register, confirm, advance; supplier receipt verification"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ed25519-dalek.workspace = true
jitsuin-board = { path = "../jitsuin-board" }
jitsuin-core = { path = "../jitsuin-core" }
jitsuin-wallet = { path = "../jitsuin-wallet" }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

[dev-dependencies]
rqrr = { version = "0.11.0", default-features = false }
# examples/testnet_cycle.rs only (HNK-17.T1): fresh keys per run, base64url output files
sha2.workspace = true
base64 = "0.22"
