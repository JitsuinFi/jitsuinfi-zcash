[package]
name = "jitsuin-wasm"
version = "0.1.0"
description = "JitsuinFi in the browser: buyer keys from a passkey, invoice and letter signing, repayment QR, client-side verification"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
ed25519-dalek.workspace = true
jitsuin-board = { path = "../jitsuin-board", default-features = false }
jitsuin-core = { path = "../jitsuin-core" }
jitsuin-wallet = { path = "../jitsuin-wallet" }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "=0.2.129"

[dev-dependencies]
jitsuin-flow = { path = "../jitsuin-flow" }
